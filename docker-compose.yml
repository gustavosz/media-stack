# ==============================================================================
# MEDIA STACK ORCHESTRator (Docker Compose Modular Architecture)
# Each service is encapsulated inside ./services/<service_name>/compose.yml
# ==============================================================================
name: media-stack

include:
  - path: services/gluetun/compose.yml
    project_directory: .
  - path: services/qbittorrent/compose.yml
    project_directory: .
  - path: services/prowlarr/compose.yml
    project_directory: .
  - path: services/flaresolverr/compose.yml
    project_directory: .
  - path: services/sonarr/compose.yml
    project_directory: .
  - path: services/radarr/compose.yml
    project_directory: .
  - path: services/bazarr/compose.yml
    project_directory: .
  - path: services/jellyfin/compose.yml
    project_directory: .
  - path: services/jellyseerr/compose.yml
    project_directory: .
  - path: services/chaptarr/compose.yml
    project_directory: .
  - path: services/calibre-web/compose.yml
    project_directory: .

networks:
  media-net:
    name: media-net
    driver: bridge

volumes:
  gluetun-data:
    name: gluetun-data
