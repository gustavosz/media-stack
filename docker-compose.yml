services:
  # =========================================================================
  # VPN (Gluetun) + Killswitch
  # =========================================================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"      # qBittorrent WebUI
      - "6881:6881"      # BitTorrent TCP
      - "6881:6881/udp"  # BitTorrent UDP
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-protonvpn}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-Argentina}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING:-on}
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - TZ=${TZ:-America/Argentina/Mendoza}
      - UPDATER_PERIOD=24h
    networks:
      - media-net

  # =========================================================================
  # Cliente Torrent (qBittorrent) - Enrutado 100% por la VPN
  # =========================================================================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    # Toda la red pasa por Gluetun (Killswitch activado)
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/Argentina/Mendoza}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${DATA_DIR}/torrents:/data/torrents

  # =========================================================================
  # Indexer Manager (Prowlarr) - Reemplaza al viejo Jackett
  # =========================================================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/Argentina/Mendoza}
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    networks:
      - media-net

  # =========================================================================
  # Solver de Cloudflare para Trackers (FlareSolverr)
  # =========================================================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-America/Argentina/Mendoza}
    networks:
      - media-net

  # =========================================================================
  # Gestión y Automatización de Series (Sonarr)
  # =========================================================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/Argentina/Mendoza}
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      # Monta /data entero para permitir hardlinks entre torrents y media
      - ${DATA_DIR}:/data
    networks:
      - media-net

  # =========================================================================
  # Gestión y Automatización de Películas (Radarr)
  # =========================================================================
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/Argentina/Mendoza}
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      # Monta /data entero para permitir hardlinks entre torrents y media
      - ${DATA_DIR}:/data
    networks:
      - media-net

  # =========================================================================
  # Descarga Automática de Subtítulos (Bazarr)
  # =========================================================================
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/Argentina/Mendoza}
    volumes:
      - ${CONFIG_DIR}/bazarr:/config
      - ${DATA_DIR}/media:/data/media
    networks:
      - media-net

  # =========================================================================
  # Servidor de Streaming de Medios (Jellyfin)
  # =========================================================================
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/Argentina/Mendoza}
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      - ${DATA_DIR}/media:/data/media
    networks:
      - media-net

  # =========================================================================
  # Portal de Peticiones y Catálogo Estilo Netflix (Jellyseerr)
  # =========================================================================
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-America/Argentina/Mendoza}
    volumes:
      - ${CONFIG_DIR}/jellyseerr:/app/config
    networks:
      - media-net

networks:
  media-net:
    name: media-net
    driver: bridge
