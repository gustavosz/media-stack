services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/Argentina/Mendoza}
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - ${CONFIG_DIR}/calibre-web:/config
      - ${DATA_DIR}/media/books:/books
      - ${DATA_DIR}/import_books:/import_books
      - ./services/calibre-web/auto-import:/custom-cont-init.d:ro
      - ./services/calibre-web/auto-import/importer.py:/app/auto_import.py:ro
      - ${CONFIG_DIR}/chaptarr:/chaptarr-config:ro
    networks:
      - media-net
