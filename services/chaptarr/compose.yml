services:
  chaptarr:
    image: chaptarr/chaptarr:latest
    container_name: chaptarr
    restart: unless-stopped
    expose:
      - "8789"
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/Argentina/Mendoza}
    volumes:
      - ${CONFIG_DIR}/chaptarr:/config
      - ${DATA_DIR}:/data
    networks:
      - media-net

  chaptarr-proxy:
    image: python:3.11-alpine
    container_name: chaptarr-proxy
    restart: unless-stopped
    command: python3 -u /app/proxy.py
    ports:
      - "8787:8787"
      - "8789:8787"
    volumes:
      - ./services/chaptarr/proxy/main.py:/app/proxy.py:ro
    depends_on:
      - chaptarr
    networks:
      - media-net
